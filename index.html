<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nattkollen</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel för att köra JSX i webbläsaren -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-600 selection:text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Generera demodata
    const generateSampleData = () => {
      const data = [];
      const now = new Date();
      for (let i = 14; i >= 1; i--) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        const bed = new Date(d);
        bed.setHours(22 + (Math.random() > 0.5 ? 1 : 0), Math.floor(Math.random() * 50), 0);
        const wake = new Date(d);
        wake.setDate(wake.getDate() + 1);
        wake.setHours(6 + (Math.random() > 0.6 ? 1 : 0), Math.floor(Math.random() * 45), 0);
        const outOfBed = new Date(wake.getTime() + (10 + Math.floor(Math.random() * 25)) * 60000);
        
        const wakeCount = Math.floor(Math.random() * 3.2);
        const nightEvents = [];
        for (let w = 0; w < wakeCount; w++) {
          const eventTime = new Date(d);
          eventTime.setDate(eventTime.getDate() + 1);
          eventTime.setHours(2 + w * 2, Math.floor(Math.random() * 50), 0);
          nightEvents.push({
            id: 'evt_' + Math.random().toString(36).substr(2, 9),
            timestamp: eventTime.getTime(),
            type: 'toilet',
            label: 'Toalettbesök'
          });
        }
        
        data.push({
          id: 'session_' + i,
          dateString: d.toISOString().split('T')[0],
          bedTime: bed.getTime(),
          wakeTime: wake.getTime(),
          outOfBedTime: outOfBed.getTime(),
          nightEvents: nightEvents,
          quality: Math.max(1, 5 - wakeCount),
          note: wakeCount > 1 ? 'Vaknade törstig' : ''
        });
      }
      return data;
    };

    function App() {
      const [sessions, setSessions] = useState(() => {
        const saved = localStorage.getItem('sleep_sessions_v2');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { }
        }
        return generateSampleData();
      });

      const [activeSession, setActiveSession] = useState(() => {
        const saved = localStorage.getItem('sleep_active_session_v2');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { }
        }
        return null;
      });

      const [activeTab, setActiveTab] = useState('tracker');
      const [statsPeriod, setStatsPeriod] = useState('week');
      const [nightFilterMode, setNightFilterMode] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);
      const [isManualModalOpen, setIsManualModalOpen] = useState(false);

      const [manualBedTime, setManualBedTime] = useState('23:00');
      const [manualWakeTime, setManualWakeTime] = useState('06:45');
      const [manualOutOfBedTime, setManualOutOfBedTime] = useState('07:05');
      const [manualWakeCount, setManualWakeCount] = useState(1);
      const [manualDate, setManualDate] = useState(new Date().toISOString().split('T')[0]);

      useEffect(() => {
        localStorage.setItem('sleep_sessions_v2', JSON.stringify(sessions));
      }, [sessions]);

      useEffect(() => {
        if (activeSession) {
          localStorage.setItem('sleep_active_session_v2', JSON.stringify(activeSession));
        } else {
          localStorage.removeItem('sleep_active_session_v2');
        }
      }, [activeSession]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (text) => {
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate(40); } catch(e) {}
        }
        setToastMessage(text);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const formatTime = (timestamp) => {
        if (!timestamp) return '--:--';
        const date = new Date(timestamp);
        return date.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      };

      const formatDate = (dateStrOrTimestamp) => {
        const date = new Date(dateStrOrTimestamp);
        return date.toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short' });
      };

      const getDurationText = (start, end) => {
        if (!start || !end) return '';
        const diffMs = end - start;
        if (diffMs <= 0) return '0 min';
        const totalMinutes = Math.floor(diffMs / (1000 * 60));
        const hours = Math.floor(totalMinutes / 60);
        const mins = totalMinutes % 60;
        if (hours === 0) return `${mins} min`;
        return `${hours} tim ${mins > 0 ? mins + ' min' : ''}`;
      };

      const handleGoToBed = () => {
        const now = Date.now();
        const todayStr = new Date().toISOString().split('T')[0];
        const newSession = {
          id: 'session_' + now,
          dateString: todayStr,
          bedTime: now,
          wakeTime: null,
          outOfBedTime: null,
          nightEvents: [],
          quality: 4,
          note: ''
        };
        setActiveSession(newSession);
        showToast(`🌙 Läggdags stämplat kl. ${formatTime(now)}`);
      };

      const handleNightAwakening = (type = 'toilet') => {
        const now = Date.now();
        const newEvent = {
          id: 'evt_' + now,
          timestamp: now,
          type: type,
          label: type === 'toilet' ? 'Toalettbesök' : 'Vaknade till'
        };

        if (activeSession) {
          const updated = {
            ...activeSession,
            nightEvents: [...(activeSession.nightEvents || []), newEvent]
          };
          setActiveSession(updated);
          showToast(`🚻 Toalettbesök loggat kl. ${formatTime(now)} (Totalt: ${updated.nightEvents.length})`);
        } else {
          const estimatedBed = now - (2 * 60 * 60 * 1000);
          const newSession = {
            id: 'session_' + now,
            dateString: new Date().toISOString().split('T')[0],
            bedTime: estimatedBed,
            wakeTime: null,
            outOfBedTime: null,
            nightEvents: [newEvent],
            quality: 3,
            note: 'Startad vid nattuppvak'
          };
          setActiveSession(newSession);
          showToast(`🚻 Loggat kl. ${formatTime(now)} (Ny nattsession påbörjad)`);
        }
      };

      const handleWakeUp = () => {
        const now = Date.now();
        if (!activeSession) {
          const estimatedBed = now - (7.5 * 60 * 60 * 1000);
          setActiveSession({
            id: 'session_' + now,
            dateString: new Date().toISOString().split('T')[0],
            bedTime: estimatedBed,
            wakeTime: now,
            outOfBedTime: null,
            nightEvents: [],
            quality: 4,
            note: ''
          });
          showToast(`👁️ Vaknade kl. ${formatTime(now)}`);
          return;
        }
        setActiveSession(prev => ({ ...prev, wakeTime: now }));
        showToast(`👁️ Vaknade kl. ${formatTime(now)}. Tryck "Stiger upp" när du kliver ur sängen.`);
      };

      const handleOutOfBed = () => {
        const now = Date.now();
        if (!activeSession) {
          const estimatedBed = now - (8 * 60 * 60 * 1000);
          const estimatedWake = now - (15 * 60 * 1000);
          const completed = {
            id: 'session_' + now,
            dateString: new Date().toISOString().split('T')[0],
            bedTime: estimatedBed,
            wakeTime: estimatedWake,
            outOfBedTime: now,
            nightEvents: [],
            quality: 4,
            note: ''
          };
          setSessions(prev => [completed, ...prev]);
          showToast(`🌅 God morgon! Uppstigning kl. ${formatTime(now)} sparad.`);
          return;
        }

        const completed = {
          ...activeSession,
          wakeTime: activeSession.wakeTime || now,
          outOfBedTime: now
        };
        setSessions(prev => [completed, ...prev]);
        setActiveSession(null);
        showToast(`🌅 God morgon! Uppstigning kl. ${formatTime(now)}. Natten är sparad!`);
      };

      const handleCancelActive = () => {
        if (window.confirm('Vill du avbryta och rensa den pågående mätningen för inatt?')) {
          setActiveSession(null);
          showToast('Pågående natt rensades.');
        }
      };

      const handleDeleteSession = (id) => {
        if (window.confirm('Vill du ta bort denna natt från historiken?')) {
          setSessions(prev => prev.filter(s => s.id !== id));
          showToast('Natt borttagen.');
        }
      };

      const handleSaveManual = (e) => {
        e.preventDefault();
        const bedDate = new Date(`${manualDate}T${manualBedTime}`);
        const wakeDate = new Date(`${manualDate}T${manualWakeTime}`);
        const outDate = new Date(`${manualDate}T${manualOutOfBedTime}`);
        
        if (wakeDate <= bedDate) wakeDate.setDate(wakeDate.getDate() + 1);
        if (outDate <= bedDate) outDate.setDate(outDate.getDate() + 1);
        if (outDate < wakeDate) outDate.setTime(wakeDate.getTime() + 10 * 60000);

        const nightEvents = [];
        for (let i = 0; i < manualWakeCount; i++) {
          const eventTime = new Date(bedDate.getTime() + (i + 1) * ((wakeDate.getTime() - bedDate.getTime()) / (manualWakeCount + 1)));
          nightEvents.push({
            id: 'evt_man_' + Math.random().toString(36).substr(2, 9),
            timestamp: eventTime.getTime(),
            type: 'toilet',
            label: 'Toalettbesök'
          });
        }

        const newEntry = {
          id: 'session_' + Date.now(),
          dateString: manualDate,
          bedTime: bedDate.getTime(),
          wakeTime: wakeDate.getTime(),
          outOfBedTime: outDate.getTime(),
          nightEvents: nightEvents,
          quality: 4,
          note: 'Manuellt inlagd'
        };

        setSessions(prev => [newEntry, ...prev]);
        setIsManualModalOpen(false);
        showToast('✅ Natten har lagts till i historiken!');
      };

      const stats = useMemo(() => {
        const all = [...sessions].sort((a, b) => b.bedTime - a.bedTime);
        let filtered = all;
        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000;

        if (statsPeriod === 'week') {
          filtered = all.filter(s => (now - s.bedTime) <= 7 * oneDay);
        } else if (statsPeriod === 'month') {
          filtered = all.filter(s => (now - s.bedTime) <= 30 * oneDay);
        }

        if (filtered.length === 0) {
          return {
            count: 0, avgSleepMinutes: 0, avgBedMinutes: 0, avgAwakenings: 0,
            totalAwakenings: 0, avgLingerMinutes: 0, zeroWakesPercentage: 0,
            commonHour: '--:--', chartData: []
          };
        }

        let totalSleepMs = 0, totalTimeInBedMs = 0, totalLingerMs = 0, totalAwakenings = 0, zeroWakesCount = 0;
        const hourHistogram = {};

        filtered.forEach(s => {
          const endWake = s.wakeTime || s.outOfBedTime || (s.bedTime + 8 * 3600000);
          const endOut = s.outOfBedTime || endWake;
          
          totalSleepMs += (endWake - s.bedTime);
          totalTimeInBedMs += (endOut - s.bedTime);
          totalLingerMs += Math.max(0, endOut - endWake);

          const wakes = s.nightEvents ? s.nightEvents.length : 0;
          totalAwakenings += wakes;
          if (wakes === 0) zeroWakesCount++;

          (s.nightEvents || []).forEach(e => {
            const hour = new Date(e.timestamp).getHours();
            hourHistogram[hour] = (hourHistogram[hour] || 0) + 1;
          });
        });

        let mostCommonHour = null, maxOccur = 0;
        Object.entries(hourHistogram).forEach(([hour, count]) => {
          if (count > maxOccur) {
            maxOccur = count;
            mostCommonHour = hour;
          }
        });

        const avgSleepMin = Math.round(totalSleepMs / (filtered.length * 60000));
        const avgBedMin = Math.round(totalTimeInBedMs / (filtered.length * 60000));
        const avgLingerMin = Math.round(totalLingerMs / (filtered.length * 60000));

        const chartData = [...filtered].reverse().slice(-14).map(s => {
          const wakes = s.nightEvents ? s.nightEvents.length : 0;
          const dateObj = new Date(s.bedTime);
          return {
            id: s.id,
            label: `${dateObj.toLocaleDateString('sv-SE', { weekday: 'narrow' })} ${dateObj.getDate()}`,
            wakeCount: wakes,
            sleepHours: (((s.wakeTime || s.bedTime) - s.bedTime) / 3600000).toFixed(1),
            outOfBedFormatted: formatTime(s.outOfBedTime || s.wakeTime),
            date: s.dateString
          };
        });

        return {
          count: filtered.length,
          avgSleepHours: Math.floor(avgSleepMin / 60),
          avgSleepMinsRest: avgSleepMin % 60,
          avgBedHours: Math.floor(avgBedMin / 60),
          avgBedMinsRest: avgBedMin % 60,
          avgLingerMin,
          avgAwakenings: (totalAwakenings / filtered.length).toFixed(1),
          totalAwakenings,
          zeroWakesPercentage: Math.round((zeroWakesCount / filtered.length) * 100),
          commonHour: mostCommonHour !== null ? `ca kl. ${mostCommonHour.padStart(2, '0')}:00` : 'Inga uppvak',
          chartData
        };
      }, [sessions, statsPeriod]);

      const exportDataCSV = () => {
        let csv = 'Datum;La sig;Vaknade;Steg upp;Sovtid (min);Tid i sang (min);Nattuppvak (antal);Klockslag for uppvak\n';
        sessions.forEach(s => {
          const bed = s.bedTime ? new Date(s.bedTime).toLocaleTimeString('sv-SE') : '';
          const wake = s.wakeTime ? new Date(s.wakeTime).toLocaleTimeString('sv-SE') : '';
          const out = s.outOfBedTime ? new Date(s.outOfBedTime).toLocaleTimeString('sv-SE') : '';
          const sleepMin = s.wakeTime && s.bedTime ? Math.round((s.wakeTime - s.bedTime) / 60000) : '';
          const bedMin = s.outOfBedTime && s.bedTime ? Math.round((s.outOfBedTime - s.bedTime) / 60000) : sleepMin;
          const wakesCount = s.nightEvents ? s.nightEvents.length : 0;
          const wakeTimes = (s.nightEvents || []).map(e => new Date(e.timestamp).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })).join(', ');
          
          csv += `${s.dateString};${bed};${wake};${out};${sleepMin};${bedMin};${wakesCount};"${wakeTimes}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `somn_uppstigning_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('📊 CSV-fil exporterad!');
      };

      return (
        <div className={`min-h-screen transition-colors duration-300 ${
          nightFilterMode 
            ? 'bg-neutral-950 text-red-500 selection:bg-red-900 selection:text-white' 
            : 'bg-slate-950 text-slate-100 selection:bg-indigo-600 selection:text-white'
        } pb-28 font-sans`}>

          {nightFilterMode && (
            <div className="fixed top-0 left-0 right-0 z-50 bg-red-950/80 border-b border-red-900/50 px-4 py-2 text-xs flex items-center justify-between backdrop-blur-sm">
              <span className="flex items-center gap-1.5 font-medium text-red-400">
                <i data-lucide="eye-off" className="w-4 h-4 text-red-400 animate-pulse"></i> Nattfilter aktivt (dämpat ljus)
              </span>
              <button onClick={() => setNightFilterMode(false)} className="px-2.5 py-1 rounded bg-red-900/60 text-red-200 text-xs hover:bg-red-800">
                Avsluta
              </button>
            </div>
          )}

          {toastMessage && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-md bg-slate-900/95 border border-indigo-500/40 text-slate-100 px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-3">
              <div className="p-2 rounded-full bg-indigo-500/20 text-indigo-400">
                <i data-lucide="check-circle-2" className="w-5 h-5"></i>
              </div>
              <span className="text-sm font-medium leading-tight">{toastMessage}</span>
            </div>
          )}

          <header className="px-5 pt-7 pb-4 max-w-md mx-auto flex items-center justify-between border-b border-slate-800/60">
            <div>
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-600/30">
                  <i data-lucide="moon" className="w-4 h-4"></i>
                </div>
                <h1 className="text-xl font-bold tracking-tight text-white">Nattkollen</h1>
              </div>
              <p className="text-xs text-slate-400 mt-0.5">Sömn, nattuppvak & uppstigning</p>
            </div>

            <button
              onClick={() => setNightFilterMode(!nightFilterMode)}
              className={`p-2.5 rounded-xl border transition-all ${
                nightFilterMode
                  ? 'bg-red-950 border-red-800 text-red-400 shadow-inner'
                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
              }`}
            >
              <i data-lucide={nightFilterMode ? "eye" : "eye-off"} className="w-5 h-5"></i>
            </button>
          </header>

          <main className="max-w-md mx-auto px-4 pt-5">
            {activeTab === 'tracker' && (
              <div className="space-y-4">
                <div className={`p-4 rounded-2xl border transition-all ${
                  activeSession 
                    ? 'bg-gradient-to-b from-indigo-950/60 to-slate-900/80 border-indigo-700/50 shadow-lg' 
                    : 'bg-slate-900/60 border-slate-800/80'
                }`}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs uppercase tracking-wider font-semibold text-slate-400 flex items-center gap-1.5">
                      <i data-lucide="clock" className="w-3.5 h-3.5 text-indigo-400"></i> Pågående dygn
                    </span>
                    {activeSession && (
                      <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Aktiv natt
                      </span>
                    )}
                  </div>

                  {activeSession ? (
                    <div className="space-y-3">
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div className="p-2 rounded-xl bg-slate-950/40 border border-slate-800/60">
                          <span className="text-slate-400 block">🌙 La dig:</span>
                          <span className="text-sm font-bold text-white">{formatTime(activeSession.bedTime)}</span>
                        </div>
                        <div className="p-2 rounded-xl bg-slate-950/40 border border-slate-800/60">
                          <span className="text-slate-400 block">👁️ Vaknade:</span>
                          <span className="text-sm font-bold text-amber-300">
                            {activeSession.wakeTime ? formatTime(activeSession.wakeTime) : 'Sover...'}
                          </span>
                        </div>
                      </div>

                      {activeSession.nightEvents && activeSession.nightEvents.length > 0 && (
                        <div className="flex flex-wrap gap-1.5 pt-1">
                          {activeSession.nightEvents.map((evt, idx) => (
                            <span key={evt.id} className="px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-300 border border-amber-500/20 text-[11px]">
                              🚻 #{idx + 1}: {formatTime(evt.timestamp)}
                            </span>
                          ))}
                        </div>
                      )}

                      <div className="flex justify-end pt-1">
                        <button onClick={handleCancelActive} className="text-xs text-rose-400/80 hover:text-rose-300 underline">
                          Avbryt / Rensa aktiv mätning
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="py-1 text-center text-slate-400 text-xs">
                      Klicka på knappen nedan när du går och lägger dig.
                    </div>
                  )}
                </div>

                <div className="space-y-3">
                  <button
                    onClick={handleGoToBed}
                    className={`w-full py-4 px-5 rounded-2xl border flex items-center justify-between transition-all active:scale-[0.98] ${
                      !activeSession 
                        ? 'bg-indigo-600 hover:bg-indigo-500 border-indigo-400/40 shadow-lg text-white' 
                        : 'bg-slate-900/70 border-slate-800 text-slate-300'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-11 h-11 rounded-xl bg-slate-800 flex items-center justify-center text-xl">🌙</div>
                      <div className="text-left">
                        <div className="font-bold text-base">1. Går och lägger mig</div>
                        <div className="text-xs opacity-75">{activeSession ? `Registrerad kl. ${formatTime(activeSession.bedTime)}` : 'Klicka när du lägger dig i sängen'}</div>
                      </div>
                    </div>
                    {activeSession ? <span className="text-emerald-400 text-xs font-bold">✓ Klar</span> : <i data-lucide="chevron-right" className="w-5 h-5 text-indigo-200"></i>}
                  </button>

                  <button
                    onClick={() => handleNightAwakening('toilet')}
                    className="w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-amber-600 to-amber-800 border border-amber-400/30 text-white shadow-lg flex items-center justify-between active:scale-[0.98]"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-11 h-11 rounded-xl bg-amber-950/80 flex items-center justify-center text-xl">🚻</div>
                      <div className="text-left">
                        <div className="font-bold text-base">2. Upp i natten (Toalett)</div>
                        <div className="text-xs text-amber-100/80">Tryck varje gång du går upp</div>
                      </div>
                    </div>
                    <div className="px-3 py-1 rounded-lg bg-amber-950/90 text-amber-200 text-xs font-bold border border-amber-400/30">
                      {activeSession?.nightEvents?.length ? `${activeSession.nightEvents.length} st` : '+1 Uppvak'}
                    </div>
                  </button>

                  <button
                    onClick={handleWakeUp}
                    className={`w-full py-4 px-5 rounded-2xl border flex items-center justify-between transition-all active:scale-[0.98] ${
                      activeSession && !activeSession.wakeTime ? 'bg-amber-500/20 border-amber-500/40 text-amber-200' : 'bg-slate-900/80 border-slate-800 text-slate-300'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-11 h-11 rounded-xl bg-slate-800 flex items-center justify-center text-xl">👁️</div>
                      <div className="text-left">
                        <div className="font-bold text-base">3. Vaknar (Slår upp ögonen)</div>
                        <div className="text-xs opacity-75">{activeSession?.wakeTime ? `Vaknade kl. ${formatTime(activeSession.wakeTime)}` : 'När du vaknat men ligger kvar'}</div>
                      </div>
                    </div>
                    {activeSession?.wakeTime ? <span className="text-amber-400 text-xs font-bold">✓ {formatTime(activeSession.wakeTime)}</span> : <span className="text-xs text-slate-400">Logga</span>}
                  </button>

                  <button
                    onClick={handleOutOfBed}
                    className="w-full py-5 px-5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 border border-emerald-300/40 text-white shadow-xl flex items-center justify-between active:scale-[0.98]"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-12 h-12 rounded-xl bg-emerald-950/80 flex items-center justify-center text-2xl">🌅</div>
                      <div className="text-left">
                        <div className="font-extrabold text-lg">4. Stiger upp (Kliver ur sängen)</div>
                        <div className="text-xs text-emerald-100/90">Avslutar dygnet & sparar sömnen</div>
                      </div>
                    </div>
                    <div className="p-2 rounded-xl bg-emerald-950/60 text-emerald-200">
                      <i data-lucide="footprints" className="w-5 h-5"></i>
                    </div>
                  </button>
                </div>

                <div className="pt-1 text-center">
                  <button onClick={() => setIsManualModalOpen(true)} className="text-xs text-indigo-400 hover:text-indigo-300 inline-flex items-center gap-1.5 py-1 px-3">
                    <i data-lucide="edit-3" className="w-3.5 h-3.5"></i> Glömt att trycka? Lägg till natt manuellt
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'stats' && (
              <div className="space-y-5">
                <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                  {[{ id: 'week', label: '7 dagar' }, { id: 'month', label: '30 dagar' }, { id: 'all', label: 'Långsiktigt' }].map(t => (
                    <button
                      key={t.id}
                      onClick={() => setStatsPeriod(t.id)}
                      className={`flex-1 py-2 text-xs font-semibold rounded-lg ${statsPeriod === t.id ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                    >
                      {t.label}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                    <div className="text-xs text-slate-400 flex items-center gap-1 mb-1">
                      <i data-lucide="trending-up" className="w-3.5 h-3.5 text-amber-400"></i> Snitt toalettbesök
                    </div>
                    <div className="text-3xl font-extrabold text-amber-400">{stats.avgAwakenings} <span className="text-sm text-slate-400">/ natt</span></div>
                  </div>

                  <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                    <div className="text-xs text-slate-400 flex items-center gap-1 mb-1">
                      <i data-lucide="footprints" className="w-3.5 h-3.5 text-emerald-400"></i> Snitt sömntid
                    </div>
                    <div className="text-3xl font-extrabold text-emerald-300">{stats.avgSleepHours}h {stats.avgSleepMinsRest}m</div>
                  </div>
                </div>

                <button onClick={exportDataCSV} className="w-full py-3.5 px-4 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-xs font-semibold flex items-center justify-center gap-2">
                  <i data-lucide="download" className="w-4 h-4 text-indigo-400"></i> Exportera tabell (CSV / Excel)
                </button>
              </div>
            )}

            {activeTab === 'history' && (
              <div className="space-y-3">
                {sessions.map((session) => (
                  <div key={session.id} className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                    <div>
                      <div className="text-xs font-bold text-slate-300">{formatDate(session.dateString || session.bedTime)}</div>
                      <div className="text-sm font-bold text-white mt-1">🌙 {formatTime(session.bedTime)} ➔ 🌅 {formatTime(session.outOfBedTime || session.wakeTime)}</div>
                    </div>
                    <button onClick={() => handleDeleteSession(session.id)} className="text-slate-600 hover:text-rose-400 p-1">
                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                    </button>
                  </div>
                ))}
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 z-40 border-t border-slate-800 bg-slate-950/90 backdrop-blur-lg px-6 py-2.5">
            <div className="max-w-md mx-auto flex items-center justify-around">
              <button onClick={() => setActiveTab('tracker')} className={`flex flex-col items-center gap-1 ${activeTab === 'tracker' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>
                <i data-lucide="moon" className="w-5 h-5"></i>
                <span className="text-[11px]">Knappar</span>
              </button>
              <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center gap-1 ${activeTab === 'stats' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>
                <i data-lucide="bar-chart-3" className="w-5 h-5"></i>
                <span className="text-[11px]">Statistik</span>
              </button>
              <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 ${activeTab === 'history' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>
                <i data-lucide="calendar" className="w-5 h-5"></i>
                <span className="text-[11px]">Historik</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
